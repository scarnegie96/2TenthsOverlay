[workspace]
# The app (egui) and the telemetry core it runs on. The previous Tauri app is
# kept in archive/tauri with its own workspace.
members = ["app", "crates/telemetry", "crates/release"]
resolver = "2"

[profile.release]
lto = true
codegen-units = 1
strip = true

# Quick optimised builds for trying changes (release does full LTO and takes minutes).
#   cargo build --profile fast   ->  target/fast/tenths
[profile.fast]
inherits = "release"
lto = false
codegen-units = 16
incremental = true

# Heap profiling: `cargo build --profile heap --features heap-profile` (see app/src/heap.rs).
# Line tables and no stripping, so each allocation shows the function and line that made it.
[profile.heap]
inherits = "fast"
debug = 1
strip = "none"
