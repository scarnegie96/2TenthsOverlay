[workspace]
# The app (egui) and the telemetry core it runs on. The previous Tauri app is
# kept in archive/tauri with its own workspace.
members = ["app", "crates/telemetry", "crates/release"]
resolver = "2"

[profile.release]
lto = true
codegen-units = 1
strip = true

# Quick optimised builds for trying changes (release does full LTO and takes minutes).
#   cargo build --profile fast   ->  target/fast/tenths
[profile.fast]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
