# Builds the app (app/, egui) for Windows on every push to main or development
# that touches it, and keeps tenths.exe and the installer as workflow artifacts to
# download and try (Actions → Windows build → the run → Artifacts). The installer
# is not signed, so no installed Tenths will take it as an update: it's for
# trying the install by hand. Never makes a release (release.yml does).
name: Windows build

on:
  push:
    branches: [main, development]
    paths:
      - "app/**"
      - "crates/telemetry/**"
      - "crates/release/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release -p tenths
      - uses: actions/upload-artifact@v4
        with:
          name: tenths-windows
          path: target/release/tenths.exe
          retention-days: 30
      - name: Installer (unsigned)
        shell: pwsh
        run: ./app/installer/build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: tenths-installer-unsigned
          path: dist/Tenths_*_x64-setup.exe
          retention-days: 30
      - name: Test
        run: cargo test --release -p tenths -p telemetry -p tenths-release
