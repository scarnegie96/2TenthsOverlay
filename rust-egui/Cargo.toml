[package]
name = "tenths-egui"
version = "0.1.0"
edition = "2021"
description = "Prototype: Tenths widgets drawn natively with egui, on the same telemetry core"
publish = false

# Its own workspace: building or testing this never touches the Tauri app.
[workspace]

[dependencies]
telemetry = { path = "../crates/telemetry" }
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "persistence", "wayland", "x11"] }
egui = "0.37"
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(windows)'.dependencies]
global-hotkey = "0.9"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_ProcessStatus", "Win32_System_Threading"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
